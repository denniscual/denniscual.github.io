<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dennis Cual</title>
  <meta name="description" content="Dennis Cual — software engineer. Projects: Redev, an AI-assisted React DevTools." />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --dim: #8b949e;
      --accent: #4cc2c4;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 640px; margin: 0 auto; padding: 4rem 1.25rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    .tagline { color: var(--dim); margin: 0 0 2.5rem; }
    .card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 1.1rem 1.25rem;
      text-decoration: none;
      color: inherit;
    }
    .card:hover { border-color: var(--accent); }
    .card h2 { margin: 0 0 0.25rem; font-size: 1.1rem; color: var(--accent); }
    .card p { margin: 0; color: var(--dim); font-size: 0.95rem; }
    footer { margin-top: 3rem; color: var(--dim); font-size: 0.85rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Dennis Cual</h1>
    <p class="tagline">Software engineer.</p>

    <a class="card" href="/redev/">
      <h2>Redev</h2>
      <p>React DevTools with an integrated AI chat assistant — inspect component
      trees, profile renders, and debug with AI directly inside Chrome DevTools.</p>
    </a>

    <footer>
      <a href="https://github.com/denniscual">GitHub</a>
    </footer>
  </main>
</body>
</html>
